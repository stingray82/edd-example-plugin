; Example Plugin — GitHub + EDD deployment, using existing deploy.sh
; Put alongside deploy.sh at the root of stingray82/edd-example-plugin.
; Do not store credentials here.

; ---- Plugin identity --------------------------------------------------------
PLUGIN_NAME=Example Plugin
PLUGIN_SLUG=example-plugin
PLUGIN_DIR=example-plugin
PLUGIN_FILE=example-plugin/example-plugin.php
PLUGIN_TAGS=wordpress,edd,software-licensing,uupd
; Leave blank to generate example-plugin-{header version}.zip
ZIP_NAME=

; ---- Publish to both GitHub and EDD -----------------------------------------
DEPLOY_TARGET=github+edd
GITHUB_REPO=stingray82/edd-example-plugin
EDD_STORE_URL=https://edddeploy.tdlab.uk/
EDD_SOFTWARE_SLUG=example-plugin
EDD_DOWNLOAD_ID=296
; Append retains existing download files if supported by receiver.
EDD_DOWNLOAD_MODE=append

; ---- Shared scripts and project metadata ------------------------------------
UNIVERSAL_HOME=C:/Ignore By Avast/0. PATHED Items/Plugins/deployscripts/universal
; Existing example-plugin changelog location from supplied config.
CHANGELOG_FILE=C:/Users/Nathan/Git/rup-changelogs/example-plugin.txt
; Required by uploaded deploy.sh when deploying to GitHub.
STATIC_FILE=static.txt
SEVEN_ZIP=C:/Ignore By Avast/7-ZipPortable/App/7-Zip/7z.exe

; ---- Credential profiles (outside Git checkout) -----------------------------
; UNIVERSAL_HOME/credentials/github/stingray82.token
GITHUB_CREDENTIAL_PROFILE=stingray82
; UNIVERSAL_HOME/credentials/edd/edddeploy-example-plugin.env
EDD_CREDENTIAL_PROFILE=edddeploy-example-plugin

; ---- Deployment safety / Git behaviour --------------------------------------
; Initial build-only test. Set to 0 only after verifying all settings.
DEPLOY_DRY_RUN=0
; GitHub release publishing works with 0; set 1 to auto-commit and push source.
GIT_PUSH_SOURCE=0
GIT_BRANCH=main
CLEANUP_RELEASE_ZIPS=0
DEST_DIR=
